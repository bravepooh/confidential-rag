[project]
name = "confidential-rag"
version = "0.1.0"
description = "Local-only retrieval library for confidential clinical guidance: tiered sourcing policy enforced in code, Hebrew+English retrieval with citations"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
