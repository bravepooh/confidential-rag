# Library source registry.  HUMAN-AUTHORED: edit by hand, do not let tooling
# rewrite this file. Fetch timestamps live in library/fetch-state.json so that
# running `fetch` can never clobber the documentation below.
#
# tier semantics (see docs/sourcing-policy.md):
#   open            open-licensed / open-access. Full text may be stored.
#   public_web      openly readable but not open-licensed, OR licence unconfirmed.
#                   Indexed for retrieval, quoted only briefly with attribution.
#   original        our own synthesis written for this project.
#   reference_only  copyrighted books. Bibliography + chapter pointers only;
#                   what gets indexed is our own concept notes (notes_path).
#   private         her material. Ingested only on the private box.
#
# Every URL here was fetched and verified as serving real content.
# Sources that remain unfetched (robots.txt disallow) stay registered as
# citation targets: the therapist can open them, we just do not index them.

